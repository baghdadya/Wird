<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12302E">
<title>ورد — الحفظ والمراجعة</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#ECEDE6; --card:#F6F6F1; --ink:#13252B; --soft:#4A5C60;
  --rule:#CFD3C9; --viridian:#0E6455; --saffron:#B8860F; --clay:#8C3B2E;
  --lilac:#4B4A7A; --tint:#0E645514;
}
[data-theme="dark"]{
  --paper:#0E1A1D; --card:#16272B; --ink:#E4E8E2; --soft:#8FA3A5;
  --rule:#2A3E42; --viridian:#3FA48D; --saffron:#D9A62B; --clay:#C97A66;
  --lilac:#9A98D4; --tint:#3FA48D18;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Noto Naskh Arabic","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:16px; line-height:1.45; padding-bottom:78px; -webkit-font-smoothing:antialiased;
}
body[dir="ltr"]{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}

header{
  position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px;
}
[data-theme="dark"] header{background:#081215;color:var(--ink)}
header h1{font-size:15px;font-weight:600;flex:1}
header .sub{display:block;font-size:10.5px;opacity:.6;font-weight:400;letter-spacing:.07em;text-transform:uppercase}
.chip{background:transparent;border:1px solid currentColor;opacity:.75;border-radius:999px;
  padding:5px 11px;font-size:12px;cursor:pointer}

.datebar{display:flex;align-items:center;gap:8px;background:var(--card);
  border-bottom:1px solid var(--rule);padding:8px 12px;position:sticky;top:52px;z-index:15}
.datebar button{background:none;border:1px solid var(--rule);border-radius:8px;
  width:34px;height:34px;font-size:17px;cursor:pointer;color:var(--soft)}
.datebar .d{flex:1;text-align:center}
.datebar .d b{display:block;font-size:15px}
.datebar .d span{display:block;font-size:11px;color:var(--soft)}
.datebar .d span.hij{color:var(--saffron);font-size:10.5px;letter-spacing:.01em}
.pill{background:var(--viridian);color:#fff;border:none!important;width:auto!important;
  padding:0 12px;border-radius:999px;font-size:12px}

main{padding:12px 12px 26px}
.view{display:none} .view.on{display:block}
.card{background:var(--card);border:1px solid var(--rule);border-radius:13px;padding:14px;margin-bottom:12px}
.card>h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--soft);font-weight:600;margin-bottom:10px}
.hint{font-size:11.5px;color:var(--soft);line-height:1.55;margin-top:7px}
.bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--viridian);transition:width .25s}
.kpi{display:flex;gap:14px;align-items:baseline;margin-bottom:9px;flex-wrap:wrap}
.kpi .n{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .u{font-size:11px;color:var(--soft);letter-spacing:.05em}

/* task sections */
.sect{margin-bottom:16px}
.sect>.hd{display:flex;align-items:center;gap:8px;margin:0 3px 8px;font-size:12.5px;
  letter-spacing:.05em;font-weight:600;color:var(--soft)}
.sect>.hd .dot{width:8px;height:8px;border-radius:99px;background:var(--viridian)}
.sect.rescue>.hd .dot{background:var(--clay)} .sect.rescue>.hd{color:var(--clay)}
.sect.newmem>.hd .dot{background:var(--lilac)}
.sect.old>.hd .dot{background:var(--saffron)}
.sect.test>.hd .dot{background:var(--ink)}
.sect.deferred>.hd{opacity:.65}

.task{background:var(--card);border:1px solid var(--rule);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;border-inline-start:3px solid var(--viridian)}
.task.rescue{border-inline-start-color:var(--clay)}
.task.newmem{border-inline-start-color:var(--lilac)}
.task.old{border-inline-start-color:var(--saffron)}
.task.deferred{opacity:.58}
.task.done{opacity:.5}
.task .ttl{font-size:16px;font-weight:600}
.task .rng{font-size:12.5px;color:var(--soft);margin-top:2px;font-variant-numeric:tabular-nums}
.task .why{font-size:11.5px;color:var(--soft);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task .acts{display:flex;gap:7px;margin-top:11px}
.task .acts button{flex:1;padding:9px 4px;border-radius:9px;border:1px solid var(--rule);
  background:transparent;font-size:13px;cursor:pointer}
.task .acts .go{background:var(--viridian);border-color:var(--viridian);color:#fff;font-weight:600;flex:1.6}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--tint);color:var(--viridian);white-space:nowrap}
.badge.w{background:#B8860F1f;color:var(--saffron)} .badge.r{background:#8C3B2E1f;color:var(--clay)}
.badge.g{background:#4A5C601f;color:var(--soft)}
.empty{text-align:center;color:var(--soft);font-size:13px;padding:26px 10px;line-height:1.7}

/* muhasaba */
.grp{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin-bottom:11px;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .count{margin-inline-start:auto;font-size:12px;color:var(--soft);font-weight:400;font-variant-numeric:tabular-nums}
.grp .allbtn{border:1px solid var(--rule);background:none;border-radius:7px;padding:3px 9px;font-size:11px;color:var(--soft);cursor:pointer}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--rule);cursor:pointer;min-height:48px}
.box{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);position:relative}
.item.done .box{background:var(--viridian);border-color:var(--viridian)}
.item.done .box::after{content:"";position:absolute;inset:0;margin:auto;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.grp.avoid .item.done .box{background:var(--clay);border-color:var(--clay)}
.item .t{flex:1;font-size:14px}
.item.done .t{color:var(--soft)}
.item .flag{font-size:10px;color:var(--saffron)}
.jadwal{overflow-x:auto;padding:4px 0 8px}
.jadwal table{border-collapse:collapse}
.jadwal .lab{font-size:9px;color:var(--soft);white-space:nowrap;padding-inline-end:6px;
  text-align:start;font-weight:400;max-width:94px;overflow:hidden;text-overflow:ellipsis}
.jadwal .cell{width:9px;height:9px;border:.5px solid var(--rule);background:var(--paper)}
.jadwal .cell.f{background:var(--viridian);border-color:var(--viridian)}
.jadwal .cell.a{background:var(--clay);border-color:var(--clay)}
.jadwal .dnum{font-size:8px;color:var(--soft);text-align:center;height:12px}
.jadwal .hnum{font-size:7.5px;color:var(--saffron);text-align:center;height:11px;opacity:.85}
.jadwal .dnum.tdy,.jadwal .hnum.tdy{color:var(--viridian);font-weight:700;opacity:1}
.jadwal td.tc{background:var(--tint)}
.jadwal .cap{font-size:12px;color:var(--soft);margin-bottom:7px;line-height:1.5}
.jadwal .cap b{color:var(--ink);font-weight:600}
.jadwal .cap i{color:var(--saffron);font-style:normal}
.jadwal .sep td{height:5px}

/* inventory */
.seg{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.seg .top{display:flex;align-items:center;gap:8px}
.seg .nm{font-weight:600;font-size:15px;flex:1}
.seg .meta{font-size:11.5px;color:var(--soft);margin-top:5px;font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:2px}
.stars i{width:7px;height:7px;border-radius:99px;background:var(--rule);display:block}
.stars i.on{background:var(--saffron)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.filters button{white-space:nowrap;border:1px solid var(--rule);background:transparent;
  border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--soft)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
[data-theme="dark"] .filters button.on{background:var(--viridian);border-color:var(--viridian);color:#06120f}

/* forms & buttons */
.field{margin-top:9px}
.field label{display:block;font-size:11px;color:var(--soft);letter-spacing:.04em;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--rule);
  border-radius:9px;background:var(--paper)}
.row2{display:flex;gap:9px}.row2>*{flex:1}
.btn{width:100%;padding:13px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);
  color:var(--paper);font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
[data-theme="dark"] .btn{background:var(--viridian);border-color:var(--viridian);color:#06120f}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);font-weight:400}
.btn.warn{background:transparent;color:var(--clay);border-color:var(--clay);font-weight:400}
.seg5{display:flex;gap:5px}
.seg5 button{flex:1;padding:11px 0;border:1px solid var(--rule);background:var(--paper);
  border-radius:9px;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg5 button.sel{background:var(--saffron);border-color:var(--saffron);color:#fff;font-weight:700}
.counter{display:flex;align-items:center;gap:10px;justify-content:space-between;
  border:1px solid var(--rule);border-radius:10px;padding:7px 9px;background:var(--paper)}
.counter b{font-size:21px;font-variant-numeric:tabular-nums;min-width:36px;text-align:center}
.counter button{width:38px;height:38px;border-radius:9px;border:1px solid var(--rule);
  background:var(--card);font-size:19px;cursor:pointer}
.marks{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.marks span{background:var(--tint);color:var(--viridian);border-radius:7px;padding:3px 8px;font-size:11.5px}

nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);
  border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:none;padding:10px 2px 12px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;color:var(--soft);font-size:10.5px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--viridian);font-weight:600}

dialog{border:none;border-radius:15px;padding:0;max-width:94vw;width:430px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000000a8}
.dlg{padding:16px;max-height:86vh;overflow:auto}
.dlg h3{font-size:16px;margin-bottom:4px}
.phase{border:1px solid var(--rule);border-radius:12px;padding:12px;margin-top:11px;background:var(--paper)}
.phase .ph{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:9px;font-weight:600}
.toast{position:fixed;bottom:88px;inset-inline:16px;z-index:60;background:var(--ink);color:var(--paper);
  padding:11px 14px;border-radius:10px;font-size:13px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
[data-theme="dark"] .toast{background:var(--viridian);color:#06120f}
.toast.on{opacity:1}
table.prev{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
table.prev td,table.prev th{border-bottom:1px solid var(--rule);padding:5px 4px;text-align:start}
table.prev th{color:var(--soft);font-weight:600}
.err{color:var(--clay)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1><span id="hTitle">ورد</span><span class="sub" id="hSub">الحفظ والمراجعة</span></h1>
  <button class="chip" id="themeBtn">◐</button>
  <button class="chip" id="langBtn">EN</button>
</header>

<div class="datebar" id="dateBar">
  <button id="prevD">‹</button>
  <div class="d"><b id="dMain"></b><span id="dSub"></span><span class="hij" id="dHij"></span></div>
  <button id="nextD">›</button>
  <button class="pill" id="todayBtn">اليوم</button>
</div>

<main>
  <section class="view on" id="v-day">
    <div class="card" id="dayHead"></div>
    <div id="dayTasks"></div>
  </section>

  <section class="view" id="v-muh">
    <div class="card" id="muhHead"></div>
    <div id="muhGroups"></div>
    <div class="card"><h3 id="jadwalL">جدول الشهر</h3><div class="jadwal" id="jadwal"></div></div>
  </section>

  <section class="view" id="v-inv">
    <div class="card" id="invSummary"></div>
    <div class="filters" id="invFilters"></div>
    <div id="invList"></div>
  </section>

  <section class="view" id="v-set">
    <div class="card">
      <h3 id="impL">الخطة الشهرية</h3>
      <div class="hint" id="impState"></div>
      <button class="btn" id="impBtn">استيراد ملف الشهر (xlsx)</button>
      <input type="file" id="impFile" accept=".xlsx,.xlsm" hidden>
      <button class="btn ghost" id="undoImp">التراجع عن آخر استيراد</button>
      <button class="btn ghost" id="tmplBtn">تنزيل ملف قالب فارغ</button>
    </div>
    <div class="card">
      <h3 id="expL">التصدير</h3>
      <button class="btn ghost" id="expMonth">تصدير تقدم الشهر (xlsx)</button>
      <button class="btn ghost" id="expBackup">نسخة احتياطية كاملة (JSON)</button>
      <button class="btn ghost" id="restBtn">استعادة من نسخة احتياطية</button>
      <input type="file" id="restFile" accept=".json" hidden>
      <div class="hint" id="expHint"></div>
    </div>
    <div class="card">
      <h3 id="setL">الإعدادات</h3>
      <div class="row2">
        <div class="field"><label id="s1L">دقائق المراجعة يوميًا</label><input type="number" id="sRev" inputmode="numeric"></div>
        <div class="field"><label id="s2L">دقائق الحفظ يوميًا</label><input type="number" id="sMem" inputmode="numeric"></div>
      </div>
      <div class="row2">
        <div class="field"><label id="s3L">يوم الراحة</label><select id="sRest"></select></div>
        <div class="field"><label id="s4L">دقائق الصفحة</label><input type="number" id="sPage" inputmode="numeric"></div>
      </div>
      <div class="row2">
        <div class="field"><label id="s7L">التقويم الهجري</label><select id="sHijCal"></select></div>
        <div class="field"><label id="s8L">تعديل الهجري (يوم)</label><select id="sHijOff"></select></div>
      </div>
      <div class="field"><label id="s5L">فواصل المراجعة بعد التقييم (أيام) — ١ إلى ٥</label>
        <input id="sInt" placeholder="1,2,4,7,14"></div>
      <div class="field"><label id="s6L">سُلّم التباعد للمقاطع الراسخة (أيام)</label>
        <input id="sLad" placeholder="14,21,30,45,60"></div>
      <button class="btn ghost" id="saveSet">حفظ الإعدادات</button>
      <div class="hint" id="setHint"></div>
      <button class="btn warn" id="wipe">حذف كل البيانات</button>
    </div>
  </section>
</main>

<nav>
  <button data-v="day" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8.5 15l2 2 4-4"/></svg><span data-t="nav.day">اليوم</span></button>
  <button data-v="muh"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></svg><span data-t="nav.muh">المحاسبة</span></button>
  <button data-v="inv"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h5v18H6a2 2 0 01-2-2z"/><path d="M20 5a2 2 0 00-2-2h-5v18h5a2 2 0 002-2z"/></svg><span data-t="nav.inv">المحفوظ</span></button>
  <button data-v="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span data-t="nav.set">الإعدادات</span></button>
</nav>

<div class="toast" id="toast"></div>

<!-- task execution sheet -->
<dialog id="taskDlg"><div class="dlg">
  <h3 id="tdTitle"></h3>
  <div class="hint" id="tdSub"></div>

  <div class="phase">
    <div class="ph" id="ph1L">المرحلة ١ — التسميع غيبًا</div>
    <div class="row2">
      <div><label class="hint" id="cErrL">الأخطاء</label>
        <div class="counter"><button data-c="mistakes" data-d="-1">−</button><b id="cErr">0</b><button data-c="mistakes" data-d="1">+</button></div></div>
      <div><label class="hint" id="cPrL">التوقفات / المساعدة</label>
        <div class="counter"><button data-c="prompts" data-d="-1">−</button><b id="cPr">0</b><button data-c="prompts" data-d="1">+</button></div></div>
    </div>
    <div class="field"><label id="mkL">علّم موضع خطأ (صفحة أو آية)</label>
      <div class="row2"><input id="mkIn" inputmode="numeric" placeholder="٢٨٤"><button class="btn ghost" id="mkAdd" style="margin:0;flex:0 0 88px">إضافة</button></div>
      <div class="marks" id="mkList"></div></div>
  </div>

  <div class="phase">
    <div class="ph" id="ph2L">المرحلة ٢ — التصحيح بالمصحف</div>
    <label class="item" style="padding:8px 0;border:none"><span class="box" id="bxFix"></span>
      <span class="t" id="fixL">صححت المواضع بالمصحف</span></label>
    <label class="item" style="padding:8px 0;border:none"><span class="box" id="bxRep"></span>
      <span class="t" id="repL">أعدت المواضع الضعيفة</span></label>
    <label class="item" style="padding:8px 0;border:none"><span class="box" id="bxMem"></span>
      <span class="t" id="memL">تم من الحفظ دون نظر</span></label>
    <div class="field"><label id="scL">التقييم ١–٥</label><div class="seg5" id="scSeg"></div></div>
    <div class="row2">
      <div class="field"><label id="minL">الدقائق الفعلية</label><input type="number" id="tdMin" inputmode="numeric"></div>
      <div class="field"><label id="nxtL">المراجعة القادمة</label><input id="tdNext" readonly></div>
    </div>
    <div class="field"><label id="ntL">ملاحظات</label><textarea id="tdNote" rows="2"></textarea></div>
  </div>

  <button class="btn" id="tdSave">إتمام المهمة</button>
  <button class="btn ghost" id="tdLater">تأجيل ليوم آخر</button>
  <button class="btn ghost" id="tdSkip">تجاوز هذه المهمة</button>
  <button class="btn ghost" id="tdCancel">إغلاق</button>
</div></dialog>

<!-- import preview -->
<dialog id="prevDlg"><div class="dlg">
  <h3 id="pvTitle">معاينة الاستيراد</h3>
  <div id="pvBody"></div>
  <button class="btn" id="pvOk">تأكيد الاستيراد</button>
  <button class="btn ghost" id="pvCancel">إلغاء</button>
</div></dialog>

<script src="xlsx.mini.min.js"></script>
<script src="app.js"></script>
</body>
</html>
